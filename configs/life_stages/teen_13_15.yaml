# Life stage: adolescent, 13-15 years.
#
# Source
#   ICMR-NIN 2020, the boys / girls 13-15 y rows.
#   Energy: Table 1a -- boys 2860 kcal/d, girls 2400 kcal/d.
#
# Peak growth spurt. Sex differences widen: boys need more energy, protein and
# zinc, girls need markedly more iron (30 mg vs 22 mg) and slightly more calcium
# relative to energy. See configs/life_stages/README.md.

